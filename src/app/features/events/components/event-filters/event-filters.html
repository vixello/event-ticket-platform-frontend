<div class="card bg-transparent shadow-none border-0">
  <div class="card-body p-0">
    <div class="flex items-center justify-between pb-2">
      <h2 class="card-title text-base font-bold uppercase tracking-wider text-base-content">
        Filters
      </h2>
      <button type="button" (click)="onClearFilters()" class="btn btn-ghost btn-xs text-rose-600 hover:bg-rose-500/10">
        Clear all
      </button>
    </div>

    <div class="divider my-2 border-base-content/10"></div>

    <!-- Date Range Filters -->
    <div class="space-y-3">
      <div class="form-control">
        <label class="label text-xs font-semibold text-base-content/70 py-1">From</label>
        <input type="date" name="filterDateFrom" [(ngModel)]="formDateFrom" (change)="onDateChange()"
          class="input input-bordered input-sm w-full text-xs bg-base-200/50" />
      </div>
      <div class="form-control">
        <label class="label text-xs font-semibold text-base-content/70 py-1">To</label>
        <input type="date" name="filterDateTo" [(ngModel)]="formDateTo" (change)="onDateChange()"
          class="input input-bordered input-sm w-full text-xs bg-base-200/50" />
      </div>
    </div>

    <!-- Location Filter -->
    <label class="form-control w-full mt-4">
      <div class="label py-1">
        <span class="label-text text-xs font-semibold text-base-content/70">Location</span>
      </div>
      <input type="text" placeholder="City or venue" class="input input-bordered input-sm w-full bg-base-200/50" />
    </label>

    <!-- Categories -->
    <div class="form-control mt-4">
      <div class="label py-1">
        <span class="label-text text-xs font-semibold text-base-content/70">Category</span>
      </div>
      <div class="space-y-1.5 mt-1">
        <label class="flex items-center gap-3 cursor-pointer py-1 px-2 rounded-lg hover:bg-base-200/50 transition-colors">
          <input type="checkbox" class="checkbox checkbox-sm rounded-md border-base-content/30 [--chkbg:theme(colors.rose.600)] [--chkfg:white]" />
          <span class="text-xs font-medium">Music</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer py-1 px-2 rounded-lg hover:bg-base-200/50 transition-colors">
          <input type="checkbox" class="checkbox checkbox-sm rounded-md border-base-content/30 [--chkbg:theme(colors.rose.600)] [--chkfg:white]" />
          <span class="text-xs font-medium">Sports</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer py-1 px-2 rounded-lg hover:bg-base-200/50 transition-colors">
          <input type="checkbox" class="checkbox checkbox-sm rounded-md border-base-content/30 [--chkbg:theme(colors.rose.600)] [--chkfg:white]" />
          <span class="text-xs font-medium">Business</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer py-1 px-2 rounded-lg hover:bg-base-200/50 transition-colors">
          <input type="checkbox" class="checkbox checkbox-sm rounded-md border-base-content/30 [--chkbg:theme(colors.rose.600)] [--chkfg:white]" />
          <span class="text-xs font-medium">Arts & Culture</span>
        </label>
      </div>
    </div>
  </div>
</div>
