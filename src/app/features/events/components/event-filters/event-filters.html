<div class="card bg-base-100 border border-base-300 shadow-sm">
  <div class="card-body">

    <div class="flex items-center justify-between">
      <h2 class="card-title text-lg">
        Filters
      </h2>

      <button type="button" (click)="onClearFilters()" class="btn btn-ghost btn-xs">
        Clear
      </button>
    </div>

    <div class="divider my-1"></div>

    <!-- Date Range Filters -->
    <div class="flex gap-3 flex-wrap">
      <!-- FROM -->
      <div class="flex flex-col flex-1">
        <div class="label">
          <span class="label-text text-xs">From</span>
        </div>
        <input type="date" name="filterDateFrom" [(ngModel)]="formDateFrom" (change)="onDateChange()"
          class="input input-bordered input-sm w-full text-xs" />
      </div>

      <!-- TO -->
      <div class="flex flex-col flex-1">
        <div class="label">
          <span class="label-text text-xs">To</span>
        </div>
        <input type="date" name="filterDateTo" [(ngModel)]="formDateTo" (change)="onDateChange()"
          class="input input-bordered input-sm w-full text-xs" />
      </div>
    </div>

    <!-- Location Filter -->
    <label class="form-control w-full mt-2">
      <div class="label">
        <span class="label-text text-xs font-medium">Location</span>
      </div>
      <input type="text" placeholder="City or venue" class="input input-bordered input-sm w-full" />
    </label>

    <!-- Categories -->
    <div class="form-control mt-2">
      <div class="label">
        <span class="label-text text-xs font-medium">Category</span>
      </div>

      <label class="flex items-center gap-3 cursor-pointer py-1">
        <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" />
        <span class="text-sm">Music</span>
      </label>

      <label class="flex items-center gap-3 cursor-pointer py-1">
        <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" />
        <span class="text-sm">Sports</span>
      </label>

      <label class="flex items-center gap-3 cursor-pointer py-1">
        <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" />
        <span class="text-sm">Business</span>
      </label>

      <label class="flex items-center gap-3 cursor-pointer py-1">
        <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" />
        <span class="text-sm">Arts & Culture</span>
      </label>
    </div>

  </div>
</div>
