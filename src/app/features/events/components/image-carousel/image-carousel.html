<!-- Carousel Section -->
<div class="relative w-full mb-12 overflow-hidden  shadow-lg border border-base-300 bg-base-100"
     (mouseenter)="stopAutoSlide()" (mouseleave)="startAutoSlide()">
    
    <!-- Carousel wrapper -->
    <div class="relative h-64 overflow-hidden md:h-[550px]">

        <!-- Item 1 -->
        <div class="absolute inset-0 transition-opacity duration-700 ease-in-out"
             [class.opacity-100]="currentSlide() === 0" [class.opacity-0]="currentSlide() !== 0" [class.pointer-events-none]="currentSlide() !== 0">
            <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1200&auto=format&fit=crop"
                class="absolute block w-full h-full object-cover" alt="Concert crowd under stage lights">
            <div class="absolute inset-0 bg-gradient-to-t from-base-300/80 via-transparent to-transparent flex items-end p-6">
                <span class="text-white font-bold text-lg drop-shadow-md">Unforgettable Live Music Experiences</span>
            </div>
        </div>

        <!-- Item 2 -->
        <div class="absolute inset-0 transition-opacity duration-700 ease-in-out"
             [class.opacity-100]="currentSlide() === 1" [class.opacity-0]="currentSlide() !== 1" [class.pointer-events-none]="currentSlide() !== 1">
            <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=1200&auto=format&fit=crop"
                class="absolute block w-full h-full object-cover" alt="Electric guitar performance">
            <div class="absolute inset-0 bg-gradient-to-t from-base-300/80 via-transparent to-transparent flex items-end p-6">
                <span class="text-white font-bold text-lg drop-shadow-md">Rock Concerts & Festival Stages</span>
            </div>
        </div>

        <!-- Item 3 -->
        <div class="absolute inset-0 transition-opacity duration-700 ease-in-out"
             [class.opacity-100]="currentSlide() === 2" [class.opacity-0]="currentSlide() !== 2" [class.pointer-events-none]="currentSlide() !== 2">
            <img src="https://images.unsplash.com/photo-1571266028243-3716f02d2d2e?q=80&w=1200&auto=format&fit=crop"
                class="absolute block w-full h-full object-cover" alt="DJ Turntables">
            <div class="absolute inset-0 bg-gradient-to-t from-base-300/80 via-transparent to-transparent flex items-end p-6">
                <span class="text-white font-bold text-lg drop-shadow-md">Electronic Beats & Nightlife</span>
            </div>
        </div>

        <!-- Item 4 -->
        <div class="absolute inset-0 transition-opacity duration-700 ease-in-out"
             [class.opacity-100]="currentSlide() === 3" [class.opacity-0]="currentSlide() !== 3" [class.pointer-events-none]="currentSlide() !== 3">
            <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1200&auto=format&fit=crop"
                class="absolute block w-full h-full object-cover" alt="Acoustic singer performance">
            <div class="absolute inset-0 bg-gradient-to-t from-base-300/80 via-transparent to-transparent flex items-end p-6">
                <span class="text-white font-bold text-lg drop-shadow-md">Intimate Acoustic Sessions</span>
            </div>
        </div>

        <!-- Item 5 -->
        <div class="absolute inset-0 transition-opacity duration-700 ease-in-out"
             [class.opacity-100]="currentSlide() === 4" [class.opacity-0]="currentSlide() !== 4" [class.pointer-events-none]="currentSlide() !== 4">
            <img src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?q=80&w=1200&auto=format&fit=crop"
                class="absolute block w-full h-full object-cover" alt="Classical orchestra violin">
            <div class="absolute inset-0 bg-gradient-to-t from-base-300/80 via-transparent to-transparent flex items-end p-6">
                <span class="text-white font-bold text-lg drop-shadow-md">Classical & Orchestral Masterpieces</span>
            </div>
        </div>

    </div>

    <!-- Slider indicators -->
    <div class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3">
        <button type="button" class="w-3 h-3 rounded-full transition-all cursor-pointer" 
                [class.bg-white]="currentSlide() === 0" [class.bg-white/40]="currentSlide() !== 0"
                (click)="goToSlide(0)" aria-label="Slide 1"></button>
        <button type="button" class="w-3 h-3 rounded-full transition-all cursor-pointer" 
                [class.bg-white]="currentSlide() === 1" [class.bg-white/40]="currentSlide() !== 1"
                (click)="goToSlide(1)" aria-label="Slide 2"></button>
        <button type="button" class="w-3 h-3 rounded-full transition-all cursor-pointer" 
                [class.bg-white]="currentSlide() === 2" [class.bg-white/40]="currentSlide() !== 2"
                (click)="goToSlide(2)" aria-label="Slide 3"></button>
        <button type="button" class="w-3 h-3 rounded-full transition-all cursor-pointer" 
                [class.bg-white]="currentSlide() === 3" [class.bg-white/40]="currentSlide() !== 3"
                (click)="goToSlide(3)" aria-label="Slide 4"></button>
        <button type="button" class="w-3 h-3 rounded-full transition-all cursor-pointer" 
                [class.bg-white]="currentSlide() === 4" [class.bg-white/40]="currentSlide() !== 4"
                (click)="goToSlide(4)" aria-label="Slide 5"></button>
    </div>

    <!-- Slider controls -->
    <button type="button" (click)="prevSlide()"
        class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none">
        <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-black/30 group-hover:bg-black/50 text-white shadow">
            <svg class="w-5 h-5 rtl:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7" />
            </svg>
        </span>
    </button>
    <button type="button" (click)="nextSlide()"
        class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none">
        <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-black/30 group-hover:bg-black/50 text-white shadow">
            <svg class="w-5 h-5 rtl:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7" />
            </svg>
        </span>
    </button>
</div>
