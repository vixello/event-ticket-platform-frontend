<section class="min-h-screen bg-base-200 py-12 px-4 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-7xl">

    <!-- Page heading -->
    <div class="mb-10 pb-6 border-b border-base-content/10">
      <p class="mb-2 text-4xl  font-semibold uppercase tracking-wider text-primary">
        Discover events
      </p>
      <p class="mt-3 max-w-2xl text-base text-base-content/70">
        Discover concerts, conferences, festivals and other events happening near you.
      </p>
    </div>

    <!-- Search -->
    <div class="mb-8">
      <app-event-search (search)="onSearch($event)" />
    </div>

    <div class="grid gap-8 lg:grid-cols-[240px_1fr]">

      <!-- Filters -->
      <aside>
        <app-event-filters />
      </aside>

      <!-- Events -->
      <div class="flex flex-col gap-8">
        <app-event-grid [events]="events" />

        <!-- Pagination Controls -->
        @if (totalPages > 1) {
          <app-pagination
            [currentPage]="currentPage"
            [totalPages]="totalPages"
            (pageChange)="fetchEvents($event)">
          </app-pagination>
        }
      </div>
    </div>
  </div>
</section>
