<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card bg-base-100 shadow-2xl max-w-md w-full border border-base-300">
    <div class="card-body p-8 text-center">

      <!-- PayPal Logo / Branding style -->
      <div class="flex justify-center items-center gap-1 mb-6">
        <span class="text-3xl font-black text-blue-600 tracking-tighter">Pay</span>
        <span class="text-3xl font-black text-blue-400 tracking-tighter">Pal</span>
        <span class="badge badge-sm badge-outline ml-2 text-xs uppercase font-semibold">Sandbox</span>
      </div>

      <h2 class="text-xl font-bold mb-2">Confirm Payment</h2>
      <p class="text-sm text-base-content/70 mb-6">
        PayPal payment gateway simulation for order ID: <br>
        <span class="font-mono text-xs bg-base-200 px-2 py-1 rounded inline-block mt-1">{{ orderId() }}</span>
      </p>

      <div class="divider"></div>

      <!-- Payment Summary -->
      <div class="bg-base-200/50 p-4 rounded-xl mb-6 text-left space-y-2">
        <div class="flex justify-between text-sm">
          <span class="text-base-content/60">Recipient:</span>
          <span class="font-semibold">Eventmaster Tickets</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-base-content/60">Amount to pay:</span>
          <span class="font-bold text-primary">FIXED / TEST</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="space-y-3">
        <button (click)="completePayment()" [disabled]="isLoading()"
          class="btn bg-blue-600 hover:bg-blue-700 text-white btn-block text-base shadow-lg shadow-blue-500/20">
          @if (isLoading()) {
          <span class="loading loading-spinner"></span>
          Processing...
          } @else {
          Pay Now (PayPal Test)
          }
        </button>

        <button (click)="cancelPayment()" [disabled]="isLoading()" class="btn btn-ghost btn-block text-base">
          Cancel and return
        </button>
      </div>

    </div>
  </div>
</div>
