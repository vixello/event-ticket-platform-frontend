<div class="min-h-screen bg-base-200">
  <div class="max-w-7xl mx-auto px-6 py-8">

    <!-- HERO -->
    <div class="hero bg-base-100 rounded-3xl shadow-xl mb-8">
      <div class="hero-content w-full justify-between flex-col lg:flex-row">

        <div class="flex items-center gap-6">
          <div class="avatar">
            <div class="w-24 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
              <img src="https://placehold.co/200x200" alt="Profile">
            </div>
          </div>

          <div>
            <h1 class="text-4xl font-bold">
              John Smith
            </h1>

            <p class="text-base-content/70 mt-2">
              Member since 2025
            </p>

            <div class="badge badge-primary mt-3">
              Verified Attendee
            </div>
          </div>
        </div>

        <div class="stats shadow">
          <div class="stat">
            <div class="stat-title">Tickets</div>
            <div class="stat-value">14</div>
          </div>

          <div class="stat">
            <div class="stat-title">Events</div>
            <div class="stat-value">11</div>
          </div>

          <div class="stat">
            <div class="stat-title">Cities</div>
            <div class="stat-value">5</div>
          </div>
        </div>

      </div>
    </div>

    <!-- UPCOMING EVENTS -->
    <div class="mb-10">
      <h2 class="text-2xl font-bold mb-4">
        Upcoming Events
      </h2>

      <div class="grid gap-5">

        <div class="card card-side bg-base-100 shadow-lg">
          <figure class="w-64">
            <img
              src="https://placehold.co/600x400"
              class="object-cover h-full w-full"
              alt="Event">
          </figure>

          <div class="card-body">
            <div class="badge badge-success w-fit">
              Upcoming
            </div>

            <h3 class="card-title">
              Summer Music Festival
            </h3>

            <p>Warsaw National Stadium</p>

            <div class="text-sm opacity-70">
              July 18, 2027 • 7:00 PM
            </div>

            <div class="card-actions justify-end">
              <button class="btn btn-primary">
                View Ticket
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- MY TICKETS -->
    <div class="mb-10">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">
          My Tickets
        </h2>

        <button class="btn btn-outline btn-sm">
          Download All
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="table bg-base-100 rounded-box">
          <thead>
            <tr>
              <th>Event</th>
              <th>Type</th>
              <th>Status</th>
              <th>QR Code</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>Summer Festival</td>
              <td>VIP</td>
              <td>
                <span class="badge badge-success">
                  Active
                </span>
              </td>
              <td>
                <button class="btn btn-sm btn-primary">
                  Show
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- EVENT HISTORY -->
    <div>
      <h2 class="text-2xl font-bold mb-4">
        Event History
      </h2>

      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">

        <div class="card bg-base-100 shadow-lg">
          <figure>
            <img src="https://placehold.co/500x300" alt="">
          </figure>

          <div class="card-body">
            <h3 class="card-title">
              Rock Night 2025
            </h3>

            <p class="text-base-content/60">
              Attended
            </p>

            <progress
              class="progress progress-success"
              value="100"
              max="100">
            </progress>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
